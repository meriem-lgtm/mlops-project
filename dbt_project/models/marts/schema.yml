version: 2

models:
  - name: earthquake_features
    description: "Final ML-ready feature table consumed by src/training and Dagster."
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: magnitude
        tests:
          - not_null
      - name: magnitude_class
        tests:
          - not_null
          - accepted_values:
              values: ['Faible', 'Moyen', 'Fort']
