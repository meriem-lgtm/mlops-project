name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # المهمة 1: التكامل المستمر (CI)
  # التحقق من جودة الكود وتشغيل الاختبارات
  # ==========================================
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest

      - name: Check formatting with Black
        # التحقق من أن الكود منسق بشكل صحيح
        run: black --check src api dagster_project

      - name: Lint with flake8
        # التحقق من أخطاء التنسيق والبناء
        run: flake8 src api dagster_project --max-line-length=120 --ignore=E203,W503 || true

      - name: Run Python tests
        # تشغيل الاختبارات الوحدوية (pytest)
        run: pytest tests/ -v

  # ==========================================
  # المهمة 2: النشر المستمر (CD)
  # بناء ونشر صورة Docker على Docker Hub
  # ==========================================
  build-and-push-docker:
    # هذه المهمة لا تعمل إلا إذا نجحت المهمة 1 (الاختبارات)
    needs: code-quality-and-tests 
    
    # النشر يتم فقط عند الدفع (push) لفرع main (وليس عند فتح Pull Request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-mlops:latest